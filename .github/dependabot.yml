version: 2
updates:
  # npm 의존성: 매주 월요일 09:00 KST(UTC 00:00) minor/patch 업데이트 PR 생성
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "chore"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # 같은 범주의 마이너/패치 업데이트는 하나의 PR로 묶기
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 메이저 업데이트는 수동으로 검토(자동 PR 생성 안 함)
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions 워크플로우에 사용된 action 버전도 자동 업데이트
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
